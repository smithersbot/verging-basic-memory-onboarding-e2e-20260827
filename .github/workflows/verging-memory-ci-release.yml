# Verging Memory CI — release tags.
#
# `suites` is deliberately omitted so a release covers every suite chosen for
# the account and set up on the named agent setups. While Verging Labs is still
# activating suites, that selection is the subset already set up, and the
# receipt names what was left out.
name: Verging Memory CI release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      fetch_only_release_id:
        description: "Fetch an existing release's report instead of submitting"
        required: false
        default: ""
permissions:
  contents: write
  checks: write
  pull-requests: write
concurrency:
  group: verging-memory-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memory-ci-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: "Verging Memory CI"
          sparse-checkout-cone-mode: true
      - uses: verginglabs/memory-ci-action@a6c4e6f7d5541f474c7d2560f10cbdbf2580b306
        with:
          api_key: ${{ secrets.VERGING_API_KEY }}
          api_base: https://ci-staging.verginglabs.com
          agent_setups: "Hermes GPT-5.6 Luna"
          product_name: "Basic Memory"
          # A tag names the release; a manual run falls back to the Action's
          # default, because a branch ref is not a valid vendor_version.
          vendor_version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          fetch_only_release_id: ${{ inputs.fetch_only_release_id }}
