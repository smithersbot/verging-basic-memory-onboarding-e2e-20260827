name: Verging Memory CI
on:
  # Manual only during onboarding: the wiring check is already proven, and a
  # push trigger would run another one on every product-integration commit.
  workflow_dispatch:
    inputs:
      fetch_only_release_id:
        description: "Fetch an existing release's report instead of submitting"
        required: false
        default: ""
  # Throwaway branch only: one live pull-request-context run to prove the
  # Action's pull request comment renders. Never merged; the branch is deleted
  # after the proof.
  pull_request:
    branches:
      - verging-wiring-check-20260831-032952-13102
permissions:
  contents: write
  checks: write
  pull-requests: write
concurrency:
  group: verging-memory-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  memory-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: "Verging Memory CI"
          sparse-checkout-cone-mode: true
      - id: version
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      # Throwaway branch only (live rendering proof). The fixture account on
      # staging has no completed release to fetch, so a local mock on this
      # runner serves one completed release's report, the same way the Action's
      # own test suite does. The real Action then runs in a real pull_request
      # event, commits the report and posts the report-summary comment. No
      # Verging API is contacted and no key is used in this mode.
      - name: Start the local report mock (rendering proof, this branch only)
        run: |
          mkdir -p "$RUNNER_TEMP/mock"
          cat > "$RUNNER_TEMP/mock/serve.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          RID = "run_20260901_liveproof"
          REPORT_MD = """# Regression Report for Basic Memory rendering-proof

          | **Tested** | Basic Memory rendering-proof |
          |---|---|
          | **Release verdict** | Ready |
          | **Date** | 2026-09-01 |
          | **Agent setups** | Claude Code · Opus 5; Hermes · GPT-5.6 Luna |
          | **Test suites** | Onboarding, Core Recall and Preference Adherence |
          | **Stage** | Preliminary report (the final report follows) |

          ## Results at a glance

          | Agent setup | Accuracy | Pending | Cost | Speed |
          |---|---|---|---|---|
          | Claude Code · Opus 5 | **21/29 (↓ 5%)** | 0 | $4.46 (↓ 4%) | 16m 42s (↓ 17%) |
          | Hermes · GPT-5.6 Luna | **17/21 (↓ 6%)** | 8 | $0.0880 (↓ 12%) | 40m 2s (↓ 12%) |

          Rendering-proof fixture (2026-09-01): this run tested nothing. The table above is reproduced verbatim from staging e2e release run_20260827_3f411a7a7039 so the live pull request comment renders a real report's Results at a glance.
          """
          STATUS = {"release_id": RID, "status": "report_ready",
                    "received_at": "2026-09-01T12:00:00Z",
                    "updated_at": "2026-09-01T12:05:00Z",
                    "vendor_version": "rendering-proof",
                    "corrections_due_by": "2026-09-04"}
          REPORT = {"release_id": RID, "status": "report_ready",
                    "vendor_version": "rendering-proof",
                    "scope": {"suites": ["onboarding", "core-recall", "preference-adherence"]},
                    "corrections_due_by": "2026-09-04",
                    "report_markdown": REPORT_MD,
                    "diff": {"format": "release-diff/v1", "verdict": "pass",
                             "cost_verdict": "pass", "release_verdict": "ready",
                             "stage": "preliminary",
                             "note": "rendering-proof fixture; nothing was tested"},
                    "evidence": []}

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a):
                  pass
              def _send(self, code, body):
                  data = json.dumps(body).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
              def do_GET(self):
                  if self.path == "/healthz":
                      self._send(200, {"ok": True})
                  elif self.path == "/v1/releases/" + RID:
                      self._send(200, STATUS)
                  elif self.path == "/v1/releases/" + RID + "/report":
                      self._send(200, REPORT)
                  else:
                      self._send(404, {"error": "not found", "fix": "rendering-proof mock serves one release only"})
              def do_POST(self):
                  self._send(404, {"error": "the rendering-proof mock accepts no submissions"})

          HTTPServer(("127.0.0.1", 8765), H).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/mock/serve.py" > "$RUNNER_TEMP/mock/serve.log" 2>&1 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8765/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/healthz
      - uses: verginglabs/memory-ci-action@v1
        with:
          api_key: "local-mock-rendering-proof"
          api_base: http://127.0.0.1:8765
          vendor_version: ${{ steps.version.outputs.short_sha }}
          product_name: "Basic Memory"
          fetch_only_release_id: run_20260901_liveproof
